name: osx-install-android-sdk-automated

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  push:
    paths:
      - 'setup/prereq_android_sdk_install.sh'
      - 'setup/android_sdk_packages'
      - '.github/workflows/android-automated-sdk-install.yml'
  pull_request:
    paths:
      - 'setup/prereq_android_sdk_install.sh'
      - 'setup/android_sdk_packages'
      - '.github/workflows/android-automated-sdk-install.yml'
  schedule:
    # * is a special character in YAML so you have to quote this string
    - cron:  '5 4 * * 0'

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  install:
    # The type of runner that the job will run on
    runs-on: macos-latest

    env:
      NEW_ANDROID_HOME: /tmp/new-install/Android/sdk

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
    - name: upgrade bash
      run: |
        brew untap aws/tap || true
        brew trust azure/bicep
        brew install bash
    - uses: actions/checkout@v2

    # Runs a single command using the runners shell
    - name: Print the current SDK root and version
      run: |
        echo "SDK root before install $ANDROID_HOME"
        cat $ANDROID_HOME/cmdline-tools/latest/source.properties
        echo "Existing installed packages"
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed

    - name: Install to a new SDK root
      run: |
        export JAVA_HOME=$JAVA_HOME_17_X64
        export ANDROID_HOME=$NEW_ANDROID_HOME
        echo "New SDK root $ANDROID_HOME"
        printf "Y\nY\nY\nY\nY\n" | bash setup/prereq_android_sdk_install.sh

    - name: Verify that all packages are as expected
      shell: bash -l {0}
      run: |
        export JAVA_HOME=$JAVA_HOME_17_X64
        echo "Comparing $ANDROID_HOME and $NEW_ANDROID_HOME"
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed > /tmp/existing_packages
        $NEW_ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list_installed > /tmp/new_packages
        diff -uw /tmp/existing_packages /tmp/new_packages
        echo "Expected differences; emulators, SDK versions, tool versions"

    - name: Verify that directory structure is consistent
      shell: bash -l -x {0}
      run: |
        export JAVA_HOME=$JAVA_HOME_17_X64
        export ANDROID_HOME=$NEW_ANDROID_HOME
        echo "New SDK root $ANDROID_HOME"
        ls -al $ANDROID_HOME
        if [ ! -d $ANDROID_HOME/emulator ]; then exit 1; fi
        if [ ! -d $ANDROID_HOME/build-tools ]; then exit 1; fi
        if [ ! -d $ANDROID_HOME/extras ]; then exit 1; fi
        if [ ! -d $ANDROID_HOME/platforms ]; then exit 1; fi
        if [ ! -d $ANDROID_HOME/platform-tools ]; then exit 1; fi
        if [ ! -d $ANDROID_HOME/system-images ]; then exit 1; fi

    - name: Ensure that the path is correct and installed programs are runnable
      shell: bash -l {0}
      run: |
        export JAVA_HOME=$JAVA_HOME_17_X64
        export ANDROID_HOME=$NEW_ANDROID_HOME
        echo "New SDK root $ANDROID_HOME"
        echo "About to run the emulator at $ANDROID_HOME/emulator/emulator"
        $ANDROID_HOME/emulator/emulator -list-avds
        echo "About to run the avdmanager at $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
        $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager list avds

    - name: Setup the cordova environment
      shell: bash -l {0}
      run: |
        export JAVA_HOME=$JAVA_HOME_17_X64
        export ANDROID_HOME=$NEW_ANDROID_HOME
        bash setup/setup_native.sh

    - name: Ensure that the path is correct and the project can be activated
      shell: bash -l {0}
      run: |
        export JAVA_HOME=$JAVA_HOME_17_X64
        export ANDROID_HOME=$NEW_ANDROID_HOME
        echo "New SDK root $ANDROID_HOME"
        echo "About to run the avdmanager at $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
        $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager list avd
