version: 2
updates:
  # Cooldowns apply to version updates, not security updates.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'thursday'
    cooldown:
      default-days: 2
    groups:
      npm-dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'thursday'
    cooldown:
      default-days: 2
    groups:
      github-actions:
        patterns:
          - '*'
